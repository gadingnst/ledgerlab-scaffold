apiVersion: batch/v1
kind: Job
metadata:
  name: ledgerlab-migrate
  namespace: ledgerlab
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: ledgerlab-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/gadingnst/ledgerlab-scaffold/tools:latest
          imagePullPolicy: Always
          command: ["pnpm", "--filter", "@ledgerlab/db", "migrate:sql"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledgerlab-secrets
                  key: DATABASE_URL
