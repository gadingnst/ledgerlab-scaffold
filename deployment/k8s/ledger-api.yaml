apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: ledgerlab
  labels:
    app: ledger-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-api
  template:
    metadata:
      labels:
        app: ledger-api
    spec:
      containers:
        - name: ledger-api
          image: ledgerlab/ledger-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
              name: http
          env:
            - name: LEDGER_API_PORT
              value: "4001"
            - name: LEDGER_API_HOST
              value: "0.0.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ledgerlab-secrets
                  key: DATABASE_URL
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ledgerlab-secrets
                  key: INTERNAL_API_TOKEN
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: ledgerlab-secrets
                  key: CORS_ORIGINS
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api
  namespace: ledgerlab
spec:
  selector:
    app: ledger-api
  ports:
    - port: 4001
      targetPort: 4001
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-api-ingress
  namespace: ledgerlab
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: ledger-api.gading.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ledger-api
                port:
                  number: 4001
